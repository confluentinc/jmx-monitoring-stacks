---
- name: Install and Configure Secure Node Exporter (Unified Remote Path)
  hosts: all:!control_center:!control_center_next_gen
  become: yes
  vars:
    node_exporter_version: "1.8.2" 
    local_tar_path: "/path/to/your/local/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    
    # --- Local Paths (On your Ansible Control Node) ---
    local_certs_dir: "/var/ssl/certs"     # Where .cer files live locally
    local_keys_dir: "/var/ssl/private"    # Where .key files live locally

    # --- Remote Path (On the Target Servers) ---
    remote_ssl_dir: "/var/ssl/private"    # Both files will land here

  tasks:
    - name: Create prometheus system group
      group:
        name: prometheus
        system: yes
        state: present

    - name: Create prometheus system user
      user:
        name: prometheus
        group: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no
        state: present

    - name: Ensure configuration directory exists
      file:
        path: /etc/node_exporter
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Ensure remote SSL directory exists
      file:
        path: "{{ remote_ssl_dir }}"
        state: directory
        owner: root
        group: root  
        mode: '0755'

    - name: Copy and unarchive local Node Exporter tarball to remote hosts
      unarchive:
        src: "{{ local_tar_path }}"
        dest: /tmp
        remote_src: no  
        owner: prometheus
        group: prometheus

    - name: Copy binary to standard executable path
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: yes 
        owner: prometheus
        group: prometheus
        mode: '0755'

    # ==================== TLS CONFIGURATION TASKS ====================

    - name: Copy Host-Specific Public Certificate (.cer) to remote SSL dir
      copy:
        src: "{{ local_certs_dir }}/{{ inventory_hostname }}.cer"
        dest: "{{ remote_ssl_dir }}/node_exporter.cer"
        owner: prometheus
        group: prometheus
        mode: '0644'

    - name: Copy Host-Specific Private Key (.key) to remote SSL dir
      copy:
        src: "{{ local_keys_dir }}/{{ inventory_hostname }}.key"
        dest: "{{ remote_ssl_dir }}/node_exporter.key"
        owner: prometheus
        group: prometheus
        mode: '0640'

    - name: Create web-config.yml pointing to unified location
      copy:
        dest: /etc/node_exporter/web-config.yml
        content: |
          tls_server_config:
            cert_file: "{{ remote_ssl_dir }}/node_exporter.cer"
            key_file: "{{ remote_ssl_dir }}/node_exporter.key"
            min_version: "TLS12"
        owner: prometheus
        group: prometheus
        mode: '0644'

    # =================================================================

    - name: Create Systemd service file
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.config.file=/etc/node_exporter/web-config.yml

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'

    - name: Ensure systemd config is loaded and service is running
      systemd:
        name: node_exporter
        state: started 
        enabled: yes
        daemon_reload: yes
