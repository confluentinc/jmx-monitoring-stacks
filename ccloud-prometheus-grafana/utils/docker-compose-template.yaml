services:
  prometheus:
    image: prom/prometheus:v2.29.2
    container_name: prometheus
    # The Metrics API export endpoint returns samples timestamped a few minutes in the past, so a
    # sample can be ~5 minutes old just before the next scrape. A 10m lookback keeps instant queries
    # from dropping out at the edge of the default 5m.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --query.lookback-delta=10m
    ports:
      - 9090:9090
    volumes:
      - $MONITORING_STACK/assets/prometheus/prometheus-config/:/etc/prometheus
      - $MONITORING_STACK/assets/prometheus-rules/:/etc/prometheus/rules

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      - "GF_SECURITY_ADMIN_USER=admin"
      - "GF_SECURITY_ADMIN_PASSWORD=password"
      - "GF_USERS_ALLOW_SIGN_UP=false"
    ports:
      - 3000:3000
    volumes:
      - $MONITORING_STACK/assets/grafana/provisioning/:/etc/grafana/provisioning
      - $MONITORING_STACK/assets/grafana/public/img/icons/confluent:/usr/share/grafana/public/img/icons/confluent
  
  confluent_cost_exporter:
    image: docker.io/mcolomerc/confluent-costs-exporter:latest
    platform: linux/amd64
    container_name: confluent_cost_exporter
    environment:
    - CONFLUENT_CLOUD_API_KEY=$CONFLUENT_CLOUD_API_KEY
    - CONFLUENT_CLOUD_API_SECRET=$CONFLUENT_CLOUD_API_SECRET
    - CACHE_EXPIRATION=240m
    - PORT=7979 
    ports:
      - 7979:7979
